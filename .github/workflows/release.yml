name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ezr43l/rtfm-s

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        name: Enforce public release gates
        shell: bash
        env:
          LICENSE_SPDX: ${{ vars.LICENSE_SPDX }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Ezr43l/rtfm-s" || {
            echo "Las releases sólo se publican desde Ezr43l/rtfm-s" >&2
            exit 1
          }
          test -f LICENSE || { echo "Falta LICENSE" >&2; exit 1; }
          test -f THIRD_PARTY_NOTICES.md || { echo "Faltan los avisos de terceros" >&2; exit 1; }
          test "$LICENSE_SPDX" = "Apache-2.0" || {
            echo "LICENSE_SPDX debe ser Apache-2.0" >&2
            exit 1
          }
          test "$IMMUTABLE_RELEASES_ENABLED" = "true" || {
            echo "La puerta externa debe confirmar releases inmutables y fijar IMMUTABLE_RELEASES_ENABLED=true" >&2
            exit 1
          }
          version="$(tr -d ' \r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v${version}" || {
            echo "El tag ${GITHUB_REF_NAME} no coincide con VERSION=${version}" >&2
            exit 1
          }
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" || {
            echo "La release exige un tag anotado, no un tag ligero" >&2
            exit 1
          }
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          peeled_ref="${tag_ref}^{}"
          remote_tag_refs="$(git ls-remote --tags origin "$tag_ref" "$peeled_ref")"
          tag_oid="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          peeled_oid="$(awk -v ref="$peeled_ref" '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          oid_re='^([0-9a-f]{40}|[0-9a-f]{64})$'
          [[ "$tag_oid" =~ $oid_re ]] || {
            echo "El remoto no expone un OID unico para el tag anotado" >&2
            exit 1
          }
          [[ "$peeled_oid" =~ $oid_re ]] || {
            echo "El remoto no expone el commit pelado del tag anotado" >&2
            exit 1
          }
          test "$peeled_oid" = "$GITHUB_SHA" || {
            echo "El tag remoto apunta a ${peeled_oid}, no a ${GITHUB_SHA}" >&2
            exit 1
          }
          test "$(git rev-parse "$tag_ref")" = "$tag_oid"
          test "$(git rev-parse "$peeled_ref")" = "$peeled_oid"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "El commit etiquetado no pertenece a main" >&2
            exit 1
          }
          {
            echo "value=$version"
            echo "tag_oid=$tag_oid"
            echo "peeled_oid=$peeled_oid"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI on this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
            --jq '.total_count')"
          test "$count" -ge 1 || {
            echo "No existe una ejecución CI correcta para ${GITHUB_SHA}" >&2
            exit 1
          }

      - name: Validate release tree and dependencies
        shell: bash
        run: |
          set -euo pipefail
          RTFM_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
          python -c "import xml.etree.ElementTree as E; E.parse('unraid/my-RTFM.xml')"
          python tests/validate_unraid_template.py
          grep -Fx '.env' .dockerignore
          grep -Fx 'local-data' .dockerignore
          grep -Fx 'secrets' .dockerignore
          grep -Fx '.codex-artifacts/' .gitignore
          grep -Fx 'tests;C/' .gitignore
          grep -Fx '.codex-artifacts/' .dockerignore
          grep -Fx 'tests;C/' .dockerignore
          bash tests/test-data-uid-migration.sh
          python tests/test_public_export.py
          bash -n .github/scripts/release-artifact.sh .github/scripts/test-release-artifact.sh \
            .github/scripts/collect-alpine-copyleft-sources.sh tests/run-smoke-suite.sh \
            tests/run-setup-smoke.sh \
            tests/run-https-proxy-smoke.sh tests/run-ha-conflict-rejoin-smoke.sh \
            scripts/update-requirements-lock.sh scripts/migrate-data-uid.sh \
            tests/test-data-uid-migration.sh
          bash scripts/update-requirements-lock.sh --check
          python -m pip install --disable-pip-version-check pip-audit==2.10.1 bandit==1.9.4
          pip-audit --requirement requirements.lock
          bandit -r app -q
          npm --prefix web audit --omit=dev --audit-level=high
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --exit-code=1
          public_export="$RUNNER_TEMP/rtfm-public-export"
          python scripts/export-public-release.py "$public_export"
          (cd "$public_export" && sha256sum --check PUBLIC_EXPORT_SHA256SUMS)
          docker run --rm -v "$public_export:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-git --redact --exit-code=1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: artifact
        name: Resolve immutable release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: bash .github/scripts/release-artifact.sh resolve

      - id: meta
        if: steps.artifact.outputs.exists == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ steps.version.outputs.value }}

      - name: Require the exact VERSION image tag
        if: steps.artifact.outputs.exists == 'false'
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          test "$GENERATED_TAGS" = "${IMAGE_NAME}:${VERSION}" || {
            echo "metadata-action genero etiquetas distintas de ${IMAGE_NAME}:${VERSION}" >&2
            exit 1
          }

      - id: push
        name: Build, test and publish AMD64/ARM64
        if: steps.artifact.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=${{ vars.LICENSE_SPDX }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            LICENSE=${{ vars.LICENSE_SPDX }}
          provenance: mode=max
          sbom: true

      - id: effective
        name: Pin and validate effective release digest
        shell: bash
        env:
          IMAGE_EXISTS: ${{ steps.artifact.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.artifact.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          LICENSE_SPDX: ${{ vars.LICENSE_SPDX }}
        run: |
          set -euo pipefail
          case "$IMAGE_EXISTS" in
            true) digest="$EXISTING_DIGEST" ;;
            false) digest="$PUSHED_DIGEST" ;;
            *) echo "Estado de imagen inesperado: $IMAGE_EXISTS" >&2; exit 1 ;;
          esac
          bash .github/scripts/release-artifact.sh validate \
            "$IMAGE_NAME" "$VERSION" "$digest" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" "$LICENSE_SPDX"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.effective.outputs.digest }}
          push-to-registry: true

      - name: Verify published manifest, vulnerabilities and attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.effective.outputs.digest }}
          TAG_OID: ${{ steps.version.outputs.tag_oid }}
          PEELED_OID: ${{ steps.version.outputs.peeled_oid }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}")"
          grep -F 'linux/amd64' <<<"$manifest"
          grep -F 'linux/arm64' <<<"$manifest"
          manifest_json="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" \
            --format '{{json .Manifest}}')"
          amd64_digest="$(jq -er \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] |
             if length == 1 then .[0] else error("digest amd64 no unico") end' \
            <<<"$manifest_json")"
          arm64_digest="$(jq -er \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] |
             if length == 1 then .[0] else error("digest arm64 no unico") end' \
            <<<"$manifest_json")"
          cache_dir="$RUNNER_TEMP/trivy-cache"
          source_verify="$RUNNER_TEMP/source-verify"
          mkdir -p release-artifacts "$cache_dir" "$source_verify"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            case "$arch" in
              amd64) platform_digest="$amd64_digest" ;;
              arm64) platform_digest="$arm64_digest" ;;
              *) exit 1 ;;
            esac
            platform_image="${IMAGE_NAME}@${platform_digest}"
            docker run --rm \
              -v "$HOME/.docker:/root/.docker:ro" \
              -v "$cache_dir:/root/.cache" \
              -v "$PWD/release-artifacts:/reports" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --skip-version-check --platform "$platform" --scanners vuln \
              --severity CRITICAL,HIGH --exit-code 1 "$platform_image"
            docker run --rm \
              -v "$HOME/.docker:/root/.docker:ro" \
              -v "$cache_dir:/root/.cache" \
              -v "$PWD/release-artifacts:/reports" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --skip-version-check --platform "$platform" --scanners vuln \
              --format spdx-json --output "/reports/sbom-${arch}.spdx.json" \
              "$platform_image"
            docker run --rm --platform "$platform" --entrypoint cat \
              "$platform_image" /app/THIRD_PARTY_NOTICES.md \
              > "$RUNNER_TEMP/THIRD_PARTY_NOTICES-${arch}.md"
            docker run --rm --platform "$platform" --entrypoint cat \
              "$platform_image" /app/NPM_THIRD_PARTY_LICENSES.txt \
              > "$RUNNER_TEMP/NPM_THIRD_PARTY_LICENSES-${arch}.txt"
            docker run --rm --platform "$platform" --entrypoint cat \
              "$platform_image" /app/PYTHON_THIRD_PARTY_LICENSES.txt \
              > "$RUNNER_TEMP/PYTHON_THIRD_PARTY_LICENSES-${arch}.txt"
          done
          cmp "$RUNNER_TEMP/THIRD_PARTY_NOTICES-amd64.md" "$RUNNER_TEMP/THIRD_PARTY_NOTICES-arm64.md"
          cmp "$RUNNER_TEMP/NPM_THIRD_PARTY_LICENSES-amd64.txt" "$RUNNER_TEMP/NPM_THIRD_PARTY_LICENSES-arm64.txt"
          cmp "$RUNNER_TEMP/PYTHON_THIRD_PARTY_LICENSES-amd64.txt" "$RUNNER_TEMP/PYTHON_THIRD_PARTY_LICENSES-arm64.txt"
          cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/THIRD_PARTY_NOTICES-amd64.md"
          cp "$RUNNER_TEMP/THIRD_PARTY_NOTICES-amd64.md" release-artifacts/THIRD_PARTY_NOTICES.md
          cp "$RUNNER_TEMP/NPM_THIRD_PARTY_LICENSES-amd64.txt" release-artifacts/NPM_THIRD_PARTY_LICENSES.txt
          cp "$RUNNER_TEMP/PYTHON_THIRD_PARTY_LICENSES-amd64.txt" release-artifacts/PYTHON_THIRD_PARTY_LICENSES.txt
          export RTFM_SOURCE_IMAGE_AMD64="${IMAGE_NAME}@${amd64_digest}"
          export RTFM_SOURCE_IMAGE_ARM64="${IMAGE_NAME}@${arm64_digest}"
          bash .github/scripts/collect-alpine-copyleft-sources.sh \
            "${IMAGE_NAME}@${DIGEST}" \
            release-artifacts/alpine-copyleft-sources.tar.gz
          tar -xzf release-artifacts/alpine-copyleft-sources.tar.gz -C "$source_verify"
          (cd "$source_verify" && sha256sum -c SHA256SUMS)
          bash .github/scripts/validate-alpine-copyleft-manifest.sh \
            "$source_verify/metadata/alpine-copyleft-packages.tsv"
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          printf 'image=%s\nversion=%s\ncommit=%s\ntag_oid=%s\npeeled_commit=%s\ndigest=%s\n' \
            "$IMAGE_NAME" "${{ steps.version.outputs.value }}" "$GITHUB_SHA" \
            "$TAG_OID" "$PEELED_OID" "$DIGEST" \
            > release-artifacts/image-digest.txt
          (cd release-artifacts && sha256sum \
            THIRD_PARTY_NOTICES.md NPM_THIRD_PARTY_LICENSES.txt \
            PYTHON_THIRD_PARTY_LICENSES.txt alpine-copyleft-sources.tar.gz \
            sbom-*.spdx.json image-digest.txt > SHA256SUMS)

      - name: Create, populate and publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.effective.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG_OID: ${{ steps.version.outputs.tag_oid }}
          PEELED_OID: ${{ steps.version.outputs.peeled_oid }}
          PRERELEASE: "true"
        run: |
          set -euo pipefail
          verify_remote_tag() {
            local phase="$1" tag_ref peeled_ref refs tag_oid_now peeled_oid_now oid_re
            tag_ref="refs/tags/${GITHUB_REF_NAME}"
            peeled_ref="${tag_ref}^{}"
            refs="$(git ls-remote --tags origin "$tag_ref" "$peeled_ref")"
            tag_oid_now="$(awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<<"$refs")"
            peeled_oid_now="$(awk -v ref="$peeled_ref" '$2 == ref { print $1 }' <<<"$refs")"
            oid_re='^([0-9a-f]{40}|[0-9a-f]{64})$'
            [[ "$tag_oid_now" =~ $oid_re ]] || {
              echo "OID remoto de tag invalido ${phase}" >&2
              return 1
            }
            [[ "$peeled_oid_now" =~ $oid_re ]] || {
              echo "OID remoto pelado invalido ${phase}" >&2
              return 1
            }
            test "$tag_oid_now" = "$TAG_OID" || {
              echo "El OID del tag cambio ${phase}" >&2
              return 1
            }
            test "$peeled_oid_now" = "$PEELED_OID" || {
              echo "El commit pelado cambio ${phase}" >&2
              return 1
            }
            test "$peeled_oid_now" = "$GITHUB_SHA" || {
              echo "El tag ya no apunta al commit de la ejecucion ${phase}" >&2
              return 1
            }
          }
          verify_remote_tag "antes de crear el draft"
          bash .github/scripts/release-artifact.sh assert "$IMAGE_NAME" "$VERSION" "$DIGEST"
          api_header='X-GitHub-Api-Version: 2026-03-10'
          gh api --method POST -H "$api_header" \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq '.body' > release-artifacts/release-notes.md
          {
            printf '\n## Imagen verificable\n\n'
            printf 'La imagen multi-arquitectura publicada queda fijada por:\n\n```text\n'
            cat release-artifacts/image-digest.txt
            printf '```\n\nLos SBOM SPDX, avisos y textos de licencia, fuentes correspondientes de ambas arquitecturas y sus sumas SHA-256 se adjuntan a esta release.\n'
          } >> release-artifacts/release-notes.md
          release_flags=(--verify-tag --draft \
            --notes-file release-artifacts/release-notes.md \
            --title "$GITHUB_REF_NAME")
          if test "$PRERELEASE" = "true"; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/SHA256SUMS \
            release-artifacts/THIRD_PARTY_NOTICES.md \
            release-artifacts/NPM_THIRD_PARTY_LICENSES.txt \
            release-artifacts/PYTHON_THIRD_PARTY_LICENSES.txt \
            release-artifacts/alpine-copyleft-sources.tar.gz \
            release-artifacts/image-digest.txt \
            release-artifacts/sbom-amd64.spdx.json \
            release-artifacts/sbom-arm64.spdx.json \
            "${release_flags[@]}"

          release_pages="$RUNNER_TEMP/release-pages.json"
          release_id=""
          for attempt in 1 2 3 4 5; do
            gh api --paginate --slurp -H "$api_header" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_pages"
            release_id="$(jq -r --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)] |
               if length == 1 then .[0].id else empty end' \
              "$release_pages")"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] && break
            sleep 2
          done
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "No se pudo resolver un único draft para ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          draft_json="$RUNNER_TEMP/release-draft.json"
          published_json="$RUNNER_TEMP/release-published.json"
          gh api -H "$api_header" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$draft_json"
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .draft == true and .immutable == false and
             .prerelease == $prerelease and .published_at == null' "$draft_json"

          verify_assets() {
            local release_json="$1"
            local expected_file actual_file asset expected_digest actual_digest
            expected_file="$RUNNER_TEMP/expected-assets.txt"
            actual_file="$RUNNER_TEMP/actual-assets.txt"
            printf '%s\n' SHA256SUMS THIRD_PARTY_NOTICES.md \
              NPM_THIRD_PARTY_LICENSES.txt PYTHON_THIRD_PARTY_LICENSES.txt \
              alpine-copyleft-sources.tar.gz image-digest.txt \
              sbom-amd64.spdx.json sbom-arm64.spdx.json | sort > "$expected_file"
            jq -r '.assets[].name' "$release_json" | sort > "$actual_file"
            diff -u "$expected_file" "$actual_file"
            jq -e '.assets | length == 8 and all(.[]; .state == "uploaded")' \
              "$release_json"
            while IFS= read -r asset; do
              expected_digest="sha256:$(sha256sum "release-artifacts/$asset" | cut -d' ' -f1)"
              actual_digest="$(jq -er --arg name "$asset" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].digest else error("asset no unico") end' \
                "$release_json")"
              test "$actual_digest" = "$expected_digest"
            done < "$expected_file"
          }

          verify_assets "$draft_json"
          verify_remote_tag "antes de publicar"
          gh api --method PATCH -H "$api_header" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -F "prerelease=${PRERELEASE}" > /dev/null

          for attempt in {1..10}; do
            gh api -H "$api_header" \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$published_json"
            if jq -e '.draft == false and .immutable == true' "$published_json" \
                >/dev/null; then
              break
            fi
            test "$attempt" -lt 10 || {
              echo "La release publicada no quedo marcada como inmutable" >&2
              exit 1
            }
            sleep 2
          done
          jq -e --arg tag "$GITHUB_REF_NAME" --argjson prerelease "$PRERELEASE" \
            '.tag_name == $tag and .draft == false and .immutable == true and
             .prerelease == $prerelease and .published_at != null' "$published_json"
          verify_assets "$published_json"
          verify_remote_tag "despues de publicar"
